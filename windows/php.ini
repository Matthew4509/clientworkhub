; Client Work Hub, home edition: PHP's settings for the built-in server and the
; command-line jobs. The launcher adds extension_dir, session.save_path and
; error_log for this PC (they need full paths).
[PHP]
extension=pdo_mysql
extension=openssl
extension=mbstring
extension=zip
extension=curl
extension=sodium
extension=fileinfo
extension=gd
memory_limit=256M
post_max_size=64M
upload_max_filesize=64M
max_execution_time=300
display_errors=Off
log_errors=On
expose_php=Off
default_charset="UTF-8"
date.timezone=UTC
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
session.gc_maxlifetime=86400
opcache.enable=0
opcache.enable_cli=0
